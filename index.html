<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Travel Recommendation Platform</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Navigation -->
  <nav>
    <div class="logo">🌍 Travel Explorer</div>
    <ul>
      <li><a href="#" onclick="displayRecommendations()">Home</a></li>
      <li><a href="#" onclick="showAboutUs()">About Us</a></li>
      <li><a href="#" onclick="showContactUs()">Contact Us</a></li>
    </ul>
  </nav>

  <!-- Search -->
  <section class="search-container">
    <input type="text" id="searchInput" placeholder="Search destinations...">
    <button id="searchButton">Search</button>
    <button id="clearButton">Clear</button>
  </section>

  <!-- Results -->
  <section id="results"></section>

  <!-- Footer -->
  <footer>
    <p>&copy; 2025 Travel Recommendation Platform. All rights reserved.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
